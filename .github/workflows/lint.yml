name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      # advisory while the scaffold fills in; make blocking after Phase 2
      - run: pylint --exit-zero core engines skills adapters agents interfaces storage
