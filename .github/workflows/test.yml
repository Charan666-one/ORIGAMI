name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      # non-editable install: robust (no .pth finder), tests import from the source
      # checkout on sys.path. macOS-only paths are behind fakes, so this runs on Linux.
      - run: pip install ".[dev]"
      - run: pytest -q
