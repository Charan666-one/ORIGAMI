name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      # exit code 5 = "no tests collected" — tolerated until Phase 1 ships
      # the first e2e test; import errors still fail the build.
      - run: pytest || { rc=$?; [ $rc -eq 5 ]; }
