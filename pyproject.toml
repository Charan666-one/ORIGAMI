[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "origami"
version = "0.1.0"
description = "Origami — a developer operating system: plain-English goals planned over a tool registry, executed with a confirm gate, backed by memory."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "requests",
    "pydantic>=2",
    "pyyaml",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pylint",
    "black",
]
llm = [
    "anthropic",
    "openai",
]
browser = [
    "playwright",
]

[project.scripts]
origami = "interfaces.cli.main:main"

[tool.setuptools.packages.find]
# platform/ is deliberately excluded: robot heritage (STRUCTURE.md §4), and its
# name would shadow the stdlib `platform` module if installed.
include = [
    "core*",
    "engines*",
    "skills*",
    "adapters*",
    "agents*",
    "interfaces*",
    "storage*",
]
exclude = [
    "tests*",
    "platform*",
    "docs*",
    "assets*",
    "scripts*",
    "docker*",
    "configs*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.black]
line-length = 100
target-version = ["py311"]
