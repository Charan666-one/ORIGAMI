[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "origami"
version = "0.1.0"
description = "Origami — a developer operating system: plain-English goals planned over a tool registry, executed with a confirm gate, backed by memory."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "requests",
    "pydantic>=2",
    "pyyaml",
    "python-dotenv",
    "psutil",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pylint",
    "black",
]
llm = [
    "anthropic",
    "openai",
]
browser = [
    "playwright",
]

[project.scripts]
origami = "interfaces.cli.main:main"

[tool.setuptools]
# the composition root lives in repo-root main.py (STRUCTURE.md); ship it so the
# `origami` console script can import build_orchestrator when installed.
py-modules = ["main"]

[tool.setuptools.packages.find]
# platforms/ (robot heritage, STRUCTURE.md §4) is excluded from packaging. It was
# renamed from platform/ so it can never shadow the stdlib `platform` module even
# when the repo root is on sys.path (compat editable mode).
include = [
    "core*",
    "engines*",
    "skills*",
    "adapters*",
    "agents*",
    "interfaces*",
    "storage*",
]
exclude = [
    "tests*",
    "platforms*",
    "docs*",
    "assets*",
    "scripts*",
    "docker*",
    "configs*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.black]
line-length = 100
target-version = ["py311"]
